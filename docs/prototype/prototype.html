<title>Lån360 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: white-label bankportal - demobjælke øverst; rådgiver = sidebar + indhold + højrekolonne; kunde = trinviser + indhold + rådgiverkort */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --sunk:#EAF0F8; --line:#D9E1EC; --fg:#13233B; --muted:#5A6A80; --ink:#0D2A52;
  --btn:#0D2A52; --btn-fg:#FFFFFF; --accent:#1D5FD6; --accent-soft:#E3ECFC;
  --ok:#17804A; --ok-soft:#E1F3E8; --warn:#985800; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE3E0;
  --violet:#5B3FC4; --violet-soft:#ECE7FB; --grey:#5A6A80; --grey-soft:#E9EDF3;
  --shadow:0 1px 2px rgba(13,42,82,.06),0 6px 18px rgba(13,42,82,.05);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121B2C; --sunk:#18233A; --line:#26344D; --fg:#E4EBF5; --muted:#94A4BD; --ink:#EEF3FA;
  --btn:#6F9BF2; --btn-fg:#08111F; --accent:#86A9F5; --accent-soft:#1B2A4A;
  --ok:#5ECB8F; --ok-soft:#143425; --warn:#E9B25C; --warn-soft:#3A2C12; --bad:#F2887C; --bad-soft:#401C19;
  --violet:#AE9CF5; --violet-soft:#271F46; --grey:#A3B0C4; --grey-soft:#1E293D; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2C; --sunk:#18233A; --line:#26344D; --fg:#E4EBF5; --muted:#94A4BD; --ink:#EEF3FA;
  --btn:#6F9BF2; --btn-fg:#08111F; --accent:#86A9F5; --accent-soft:#1B2A4A;
  --ok:#5ECB8F; --ok-soft:#143425; --warn:#E9B25C; --warn-soft:#3A2C12; --bad:#F2887C; --bad-soft:#401C19;
  --violet:#AE9CF5; --violet-soft:#271F46; --grey:#A3B0C4; --grey-soft:#1E293D; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;color:var(--ink);text-wrap:balance}
h1{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* demobjælke */
.demobar{background:var(--sunk);border-bottom:1px solid var(--line)}
.demobar-in{max-width:1400px;margin:0 auto;padding:7px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem}
.logo360{font-weight:800;letter-spacing:-.02em;color:var(--ink)} .logo360 b{color:var(--accent)}
.demotag{font-size:.72rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px}
.seg{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);padding:2px;border-radius:9px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.demobar .seg{margin-left:auto}

/* knapper og felter */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.btn.lg{padding:13px 24px;font-size:1.02rem}
.btn.sm{padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn.link{border:0;background:none;padding:0;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:.85rem;font-weight:600;color:var(--fg)}
.field>span em{color:var(--bad);font-style:normal}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
input[readonly]{background:var(--sunk);color:var(--muted)}
textarea{min-height:96px;resize:vertical}
.err{color:var(--bad);font-size:.85rem}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 16px;cursor:pointer;font-weight:600;min-width:64px}
.opt-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.toggle{position:relative;width:46px;height:26px;border-radius:99px;border:0;background:var(--line);cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{left:23px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.note.ok{background:var(--ok-soft)} .note.warn{background:var(--warn-soft)}
.note .i{color:var(--accent)} .note.ok .i{color:var(--ok)} .note.warn .i{color:var(--warn)}
.ic-circle{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ic-circle.ok{background:var(--ok-soft);color:var(--ok)}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.checklist .i{color:var(--ok);width:18px;height:18px;margin-top:2px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)} .p-info{color:var(--accent);background:var(--accent-soft)}
.p-warn{color:var(--warn);background:var(--warn-soft)} .p-bad{color:var(--bad);background:var(--bad-soft)}
.p-violet{color:var(--violet);background:var(--violet-soft)} .p-grey{color:var(--grey);background:var(--grey-soft)}
.bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:70px;flex:1}
.bar>i{display:block;height:100%;background:var(--accent)} .bar.full>i{background:var(--ok)}
.prog{display:flex;align-items:center;gap:10px;min-width:150px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.78rem;font-weight:700;color:var(--muted);padding:9px 12px;background:var(--sunk);white-space:nowrap}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.cell-main{font-weight:700;color:var(--ink)}

/* rådgiver */
.adv{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 42px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.side .bankmark{padding:4px 10px 16px}
.navbtn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--fg);font-weight:600;text-align:left;width:100%}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.badge{margin-left:auto;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 7px}
.advmain{min-width:0;display:flex;flex-direction:column}
.advtop{display:flex;gap:14px;align-items:center;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:0 12px}
.search input{border:0;background:none;padding:9px 0}
.search input:focus{outline:none}
.me{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.avatar.lg{width:56px;height:56px;font-size:1.1rem}
.bell{position:relative;border:0;background:none;cursor:pointer;color:var(--fg);padding:6px}
.bell .badge{position:absolute;top:0;right:-4px}
.content{padding:24px;padding-block:24px 60px;max-width:1400px;width:100%}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.kpi b{display:block;font-size:1.7rem;font-weight:800;color:var(--ink);line-height:1.1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.task{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:700;color:var(--ink);cursor:pointer}
.msg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.msg:first-of-type{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}

.steps{display:flex;align-items:flex-start;margin:6px 0 4px;overflow-x:auto;padding-bottom:4px}
.st{flex:1;display:grid;justify-items:center;gap:6px;position:relative;min-width:76px;text-align:center}
.st::before{content:"";position:absolute;top:16px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--ok)}
.st-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);color:var(--muted);position:relative;z-index:1;border:2px solid var(--bg)}
.st.done .st-dot{background:var(--ok);color:#fff}
.st.cur .st-dot{background:var(--btn);color:var(--btn-fg)}
.st-l{font-size:.8rem;color:var(--muted);line-height:1.2}
.st.cur .st-l{color:var(--ink);font-weight:700}
.st .i{width:16px;height:16px;stroke-width:2.6}

.case-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.apps-mini{display:flex;gap:22px;flex-wrap:wrap}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.econ{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.econ>.card{align-content:start}
.econ .big{font-size:1.5rem;font-weight:800;color:var(--ink)}
.timeline{display:grid;gap:0;list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:24px 1fr;gap:10px;position:relative;padding-bottom:14px}
.timeline li::before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tl-dot.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tl-dot.cur{border-color:var(--accent);background:var(--accent-soft)}
.tl-dot .i{width:14px;height:14px;stroke-width:2.6}
.wiz-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.radio-card{display:grid;grid-template-columns:auto auto 1fr;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--surface);text-align:left;width:100%}
.radio-card[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.radio-card[aria-checked="true"] .radio-dot{border-color:var(--accent)}
.radio-card[aria-checked="true"] .radio-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.sumcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.preview-mail{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:10px;font-size:.9rem}
.doclist{display:grid;gap:2px}
.docline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.fieldset{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.rejbox{display:grid;gap:8px;padding:10px;background:var(--bad-soft);border-radius:9px;margin-top:8px}

/* kunde */
.cusbar{background:var(--surface);border-bottom:1px solid var(--line)}
.cusbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bankmark-txt{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--ink);letter-spacing:-.01em;font-size:1.12rem}
.bankmark-txt i{width:28px;height:28px;border-radius:7px;background:var(--btn);display:grid;place-items:center;color:var(--btn-fg);font-style:normal;font-size:.85rem}
.cuswrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:grid;gap:22px}
.cus-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.hero{display:grid;gap:12px;padding:8px 0 4px}
.hero .lead{font-size:1.12rem;color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:12px 28px}
.facts span{display:inline-flex;gap:10px;align-items:center;color:var(--fg);font-weight:500}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;text-align:center}
.how .ic-circle{margin:0 auto 6px;width:54px;height:54px}
.consent{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.bankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.banktile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px 10px;cursor:pointer;font-weight:700;color:var(--ink);text-align:center}
.banktile:hover,.banktile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acct{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.upl{display:grid;gap:10px;padding:16px;border:1.5px dashed var(--line);border-radius:var(--r)}
.upl.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.upl input[type=file]{font-size:.85rem;max-width:100%}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.revrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.revrow:first-child{border-top:0}
.cusfoot{max-width:1180px;margin:0 auto;padding:18px 16px 30px;display:flex;flex-wrap:wrap;gap:12px 22px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
.cusfoot .pb{margin-left:auto}
.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mitid-btn{background:#0060E6;color:#fff;border:0;border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:1rem}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
.big-check{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.big-check .i{width:36px;height:36px;stroke-width:2.6}

/* systemejer */
tr.lvl-bank td{background:var(--sunk);font-weight:700}
tr.lvl-dept td:first-child{padding-left:26px;font-weight:600}
tr.lvl-adv td:first-child{padding-left:44px}
.phases{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);min-width:110px}
.phases i{display:block;height:100%}
.ph-invited{background:var(--line)} .ph-collecting{background:var(--accent)} .ph-awaiting{background:var(--warn)} .ph-ready{background:var(--ok)} .ph-credit{background:var(--violet)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.flag{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.flag:first-child{border-top:0}

.modal-bg{position:fixed;inset:0;background:rgba(8,17,31,.45);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--surface);border-radius:var(--r);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:22px;display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:40;max-width:90vw}
.sim{font-size:.7rem;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:0 6px;font-weight:600}

@media (max-width:1500px){.home-grid{grid-template-columns:1fr}.home-aside{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}}
@media (max-width:1100px){.case-grid,.wiz-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .adv{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side .bankmark,.side .spacer{display:none}
  .navbtn{width:auto;white-space:nowrap;padding:8px 12px}
  .navbtn[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .cus-grid{grid-template-columns:1fr}
  .content{padding:16px;padding-block:16px 50px}
  .advtop{padding:10px 16px}
  .case-head{grid-template-columns:1fr}
}
@media (max-width:640px){
  .st{min-width:34px} .st .st-l{display:none} .st.cur .st-l{display:block;position:absolute;top:40px;white-space:nowrap}
  .steps{padding-bottom:24px}
  .demobar .seg{margin-left:0}
  .me .who{display:none}
  .consent{grid-template-columns:auto 1fr}.consent .toggle-wrap{grid-column:1/3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="demobar"></div>
<div id="root"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

const fullName=a=>(a.first+" "+a.last).trim();
const names=c=>c.apps.map(fullName).join(" & ");
const combo=c=>c.apps.map(a=>a.type==="emp"?L("Lønmodtager","Employee"):L("Selvstændig","Self-employed")).join(" + ");
const typeL=a=>a.type==="emp"?L("Lønmodtager","Employee"):L("Selvstændig","Self-employed");
const RECEIVED=s=>s==="auto"||s==="upload"||s==="filled";
const AUTO_BY={2:"bank",3:"bank",4:"pension",6:"skat",7:"skat",8:"skat"};
function docState(c,a,n){
  if(a.rejected[n])return {s:"rejected",src:LL(SRC.upload),reason:a.rejected[n]};
  if(n===9)return a.mitid?{s:"auto",src:LL(SRC.mitid),d:a.mitidAt}:{s:"waiting",src:LL(SRC.mitid)};
  if(n===1)return a.infoDone?{s:"filled",src:LL(SRC.cpr),d:a.infoAt}:{s:a.mitid?"missing":"waiting",src:LL(SRC.cpr)};
  if(n===5){const u=a.uploads[5];return u&&u.length?{s:"upload",src:LL(SRC.upload),d:u[0].d,files:u}:{s:a.mitid?"missing":"waiting",src:LL(SRC.upload)}}
  if(n===11){const x=a.uploads["11a"],y=a.uploads["11b"];return x&&x.length&&y&&y.length?{s:"upload",src:LL(SRC.cvr),d:y[0].d,files:[...x,...y]}:{s:a.mitid?"missing":"waiting",src:LL(SRC.cvr)}}
  const by=AUTO_BY[n];const cons=a.consents[by];const src=n===8&&a.consents.tinglysning?LL(SRC.skatt):LL(SRC[by]);
  if(cons&&(by!=="bank"||a.bankLinked))return {s:"auto",src,d:a.fetchAt};
  const u=a.uploads[n];if(u&&u.length)return {s:"upload",src:LL(SRC.upload),d:u[0].d,files:u};
  if(!a.mitid)return {s:"waiting",src};
  if(cons===false)return {s:"missing",src:LL(SRC.upload)};
  return {s:"consent",src};
}
function sagItems(c){ // fælles punkter
  const main=c.apps[0];const out=[];
  out.push({k:10,name:L("Budget","Budget"),st:c.rejected[10]?{s:"rejected",src:LL(SRC.form),reason:c.rejected[10]}:c.budget?{s:"filled",src:LL(SRC.form),d:main.submittedAt??0}:{s:main.mitid?"missing":"waiting",src:LL(SRC.form)},req:true});
  if(c.propAddr&&PURP[c.purpose].prop)out.push({k:"bbr",name:LL(EXTRA.bbr),st:{s:"auto",src:LL(SRC.bbr),d:c.created},req:true});
  ["kob","gave","anden"].forEach(k=>{if(c.extras[k]){const u=c.uploads[k];out.push({k,name:LL(EXTRA[k]),st:c.rejected[k]?{s:"rejected",src:LL(SRC.upload),reason:c.rejected[k]}:u&&u.length?{s:"upload",src:LL(SRC.upload),d:u[0].d,files:u}:{s:main.mitid?"missing":"waiting",src:LL(SRC.upload)},req:true})}});
  return out;
}
function allItems(c){const o=[];c.apps.forEach((a,i)=>req(a).forEach(n=>o.push({i,n,st:docState(c,a,n)})));sagItems(c).forEach(x=>o.push({i:null,n:x.k,st:x.st,name:x.name}));return o}
function progress(c){const it=allItems(c);const r=it.filter(x=>RECEIVED(x.st.s)).length;return {r,total:it.length,missing:it.length-r,pct:Math.round(r/it.length*100)}}
function statusOf(c){
  if(c.stage==="done")return "done";if(c.stage==="credit")return "credit";
  const p=progress(c);if(p.missing===0)return "ready";
  if(!c.apps.some(a=>a.mitid))return "invited";
  if(c.apps.every(a=>a.submitted)||allItems(c).some(x=>x.st.s==="rejected"))return "awaiting";
  return "collecting";
}
const lastAct=c=>c.history.length?Math.min(...c.history.map(h=>h.d)):c.created;
function pill(key,map=ST){const m=map[key];return `<span class="pill p-${m[2]}">${esc(S.lang==="da"?m[0]:m[1])}</span>`}
const itemName=x=>x.name||LL(DOC[x.n]);
function hist(c,da,en){c.history.unshift(H(0,nowHM(),da,en))}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const cpr=a=>a.cpr.slice(0,6)+"-XXXX";
const initials=n=>n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
function econ(c){
  const skatOK=c.apps.map(a=>a.consents.skat&&a.mitid);const bankOK=c.apps.map(a=>a.consents.bank&&a.bankLinked);const penOK=c.apps.map(a=>a.consents.pension&&a.mitid);
  const sum=(arr,f)=>arr.reduce((s,a,i)=>s+f(a,i),0);
  const gross=skatOK.every(Boolean)?sum(c.apps,a=>a.fin.gross):null;
  const net=c.apps.map((a,i)=>skatOK[i]?a.fin.net:null);
  const savings=bankOK.every(Boolean)?sum(c.apps,a=>a.fin.savings):null;
  const pension=penOK.every(Boolean)?sum(c.apps,a=>a.fin.pension):null;
  const debts=[];c.apps.forEach((a,i)=>{if(skatOK[i])a.fin.debts.forEach(d=>debts.push({who:a.first,t:LL(d.t),amt:d.amt}))});
  const debtSum=skatOK.every(Boolean)?debts.reduce((s,d)=>s+d.amt,0):null;
  let inc=null,exp=null,disp=null;
  if(c.budget){const b=c.budget;inc=b.inc.reduce((s,x)=>s+(+x||0),0);exp=["housing","transport","insurance","kids","subs","loans","food","other"].reduce((s,k)=>s+(+b[k]||0),0);disp=inc-exp}
  const loan=c.loan||Math.max(0,c.price-c.downpay);
  return {gross,net,savings,pension,debts,debtSum,inc,exp,disp,loan,
    downPct:PURCHASE(c.purpose)&&c.price?c.downpay/c.price:null,ltv:c.price?loan/c.price:null,
    debtFactor:gross&&debtSum!=null?((c.purpose==="refi"?debtSum-(debts.find(d=>/Realkredit|Mortgage/.test(d.t))?.amt||0):debtSum)+loan)/gross:null};
}

  if(s===5){const ap=w.a.slice(0,w.co?2:1);if(w.msg===null)w.msg=defaultMsg();

function defaultMsg(){const w=S.wiz;const n=w.a.slice(0,w.co?2:1).map(a=>a.first||"").filter(Boolean).join(L(" og "," and "));const me=advInfo(ME);
  return L(`Hej ${n}\n\nTak for en god samtale. Som aftalt sender jeg et link til jeres boligsag. De fleste oplysninger hentes automatisk, når I logger ind med MitID – resten kan I uploade direkte.\n\nHar I spørgsmål, er I altid velkomne til at kontakte mig.\n\nMed venlig hilsen\n${me.a.name}\nPrivatrådgiver, ${me.b.name}`,
   `Hi ${n}\n\nThank you for a good meeting. As agreed, here is the link to your home case. Most information is fetched automatically when you sign in with MitID – you can upload the rest directly.\n\nIf you have any questions, feel free to contact me.\n\nKind regards\n${me.a.name}\nPersonal advisor, ${me.b.name}`)}
function wizValidate(){
  const w=S.wiz,s=w.step,e=[];
  const chk=(a,who,i)=>{if(!a.first.trim()||!a.last.trim())e.push(who+L(": navn mangler",": name missing"));
    if(!/^\d{6}-?\d{4}$/.test(a.cpr.trim()))e.push(who+L(": CPR-nummer skal have formatet ddmmåå-xxxx",": CPR number must use the format ddmmyy-xxxx"));
    if(!/^\S+@\S+\.\S+$/.test(a.email.trim()))e.push(who+L(": ugyldig e-mail",": invalid email"));
    if(a.phone.replace(/\D/g,"").length<8)e.push(who+L(": telefonnummer mangler",": phone number missing"));
    if((i===0||!a.sameAddr)&&(!a.addr.trim()||!a.zip.trim()||!a.city.trim()))e.push(who+L(": adresse mangler",": address missing"));
    if(a.type==="self"&&(!a.company.trim()||!/^\d{8}$/.test(a.cvr.trim())))e.push(who+L(": virksomhedsnavn og CVR-nummer (8 cifre) kræves for selvstændige",": company name and CVR number (8 digits) are required for self-employed"))};
  if(s===0)chk(w.a[0],L("Kunde","Customer"),0);
  if(s===1&&w.co)chk(w.a[1],L("Medansøger","Co-applicant"),1);
  if(s===3){if(PURCHASE(w.purpose)){if(!(+w.price>0))e.push(L("Angiv købspris","Enter purchase price"));if(!(+w.downpay>=0)||w.downpay==="")e.push(L("Angiv udbetaling","Enter down payment"));
      else if(+w.price>0&&+w.downpay/ +w.price<0.05)e.push(L("Udbetalingen skal være mindst 5 % af købsprisen","The down payment must be at least 5% of the price"))}
    else if(!(+w.loan>0))e.push(L("Angiv ønsket lånebeløb","Enter requested loan amount"));
    if(PURP[w.purpose].prop&&(!w.propAddr.trim()||!w.propZip.trim()||!w.propCity.trim()))e.push(L("Angiv ejendommens adresse","Enter the property address"))}
  if(s===4&&!w.confirm)e.push(L("Bekræft at oplysningerne er korrekte","Confirm that the details are correct"));
  if(s===5&&!w.email&&!w.sms)e.push(L("Vælg mindst én kanal","Choose at least one channel"));
  w.err=e;return !e.length;
}

function ownView(){
  const active=CASES.filter(c=>!["done"].includes(statusOf(c)));
  const avgP=Math.round(active.reduce((s,c)=>s+progress(c).pct,0)/Math.max(active.length,1));
  const withMiss=active.filter(c=>progress(c).missing>0&&c.stage==="open").length;

    return {n:cs.length,ph,avg:cs.length?Math.round(cs.reduce((s,c)=>s+progress(c).pct,0)/cs.length):0,oldest:open.length?Math.max(...open.map(c=>c.created)):null}};

  let rows="";BANKS.forEach(b=>{const bc=CASES.filter(c=>advInfo(c.adv).b.id===b.id);rows+=line("lvl-bank",esc(b.name),agg(bc));
   DEPTS.filter(d=>d.bank===b.id).forEach(d=>{rows+=line("lvl-dept",esc(d.name),agg(CASES.filter(c=>advInfo(c.adv).d.id===d.id)));
    ADVS.filter(a=>a.dept===d.id).forEach(a=>rows+=line("lvl-adv",esc(a.name),agg(CASES.filter(c=>c.adv===a.id)),a.login===0?L("i dag","today"):a.login+L(" d"," d")))})});
  const flags=[];

  ADVS.filter(a=>a.login>=7).forEach(a=>flags.push({sev:"p-info",txt:L(`${a.name} har ikke logget ind i ${a.login} dage`,`${a.name} has not signed in for ${a.login} days`),adv:a.id}));

  <div class="kpis">${[["bank",BANKS.length,L("Kunder (banker)","Customers (banks)")],["doc",active.length,L("Aktive sager","Active cases")],["chart",avgP+" %",L("Gns. fremdrift","Avg. progress")],["info",Math.round(withMiss/Math.max(active.length,1)*100)+" %",L("Sager med mangler","Cases with missing items")]].map(([ic,n,l])=>`<div class="card kpi" style="cursor:default"><span class="ic-circle">${I(ic)}</span><span><b class="num">${n}</b><span class="small muted">${l}</span></span></div>`).join("")}</div>
  <section class="card stack"><div class="row between"><h2>${L("Bank → afdeling → rådgiver","Bank → department → advisor")}</h2><div class="legend">${PH.map(k=>`<span><i class="ph-${k}"></i>${LL(CST[k])}</span>`).join("")}</div></div>
   <div class="tbl-wrap"><table><thead><tr><th></th><th>${L("Aktive sager","Active cases")}</th><th>${L("Faser","Phases")}</th><th>${L("Gns. fremdrift","Avg. progress")}</th><th>${L("Ældste åbne sag","Oldest open case")}</th><th>${L("Sidst logget ind","Last sign-in")}</th></tr></thead><tbody>${rows}</tbody></table></div></section>

  document.getElementById("demobar").innerHTML=`<div class="demobar">${demobar()}</div>`;
  let html="";
  if(S.view==="adv"){let inner;
    if(S.page==="home")inner=pageHome();else if(S.page==="cases")inner=pageCases();else if(S.page==="messages")inner=pageMessages();
    else if(S.page==="new"){if(!S.wiz)S.wiz=newWiz();inner=pageNew()}else if(S.page==="invited")inner=pageInvited();else inner=pageCase();
    html=advShell(inner)}
  else if(S.view==="cus")html=cusView();else html=ownView();
  document.getElementById("root").innerHTML=html;
  const m=document.getElementById("modalRoot");
  if(S.modal){m.innerHTML=`<div class="modal-bg" data-a="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="row between"><h2 id="mt">${esc(S.modal.title)}</h2><button class="btn sm" type="button" data-a="closemodal" aria-label="${L("Luk","Close")}">${I("x")}</button></div>
   <p class="small muted">${L("Kilde","Source")}: ${esc(S.modal.src)} <span class="sim">${L("fiktive data","fictitious data")}</span></p><dl class="kv">${S.modal.rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></div></div>`}else m.innerHTML="";
}
function go(){render();window.scrollTo(0,0)}

/* ===================== Hændelser ===================== */
function setPath(obj,path,val){const k=path.split(".");let o=obj;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  if(el.classList.contains("modal-bg")&&e.target!==el)return;
  const a=el.dataset.a,d=el.dataset;
  const C=()=>byId(CASES,S.caseId);
  switch(a){
   case "view":S.view=d.v;S.modal=null;go();break;
   case "lang":S.lang=S.lang==="da"?"en":"da";render();break;
   case "nav":S.page=d.p;S.rejecting=null;if(d.p==="new")S.wiz=newWiz();if(d.p==="messages")CASES.forEach(c=>(c.messages||[]).forEach(m=>m.unread=false));go();break;
   case "open":S.caseId=d.id;S.page="case";S.tab="overview";S.rejecting=null;(byId(CASES,d.id).messages||[]).forEach(m=>m.unread=false);go();break;
   case "listtab":S.listTab=d.t;if(S.page==="home"&&el.classList.contains("kpi"))S.page="cases";render();break;
   case "task":S.tasksDone[d.id]=el.checked;render();break;
   case "tab":S.tab=d.t;S.rejecting=null;render();break;
   case "wtype":S.wiz.a[+d.i].type=d.t;render();break;
   case "wco":S.wiz.co=!S.wiz.co;S.wiz.err=[];render();break;
   case "wpurp":S.wiz.purpose=d.k;render();break;
   case "wgo":S.wiz.step=+d.s;S.wiz.err=[];go();break;
   case "wconfirm":S.wiz.confirm=el.checked;break;
   case "wextra":S.wiz.extras[d.k]=el.checked;break;
   case "wch":S.wiz[d.k]=el.checked;break;
   case "wprev":S.wiz.step--;S.wiz.err=[];go();break;
   case "wnext":if(wizValidate()){if(S.wiz.step===4)S.wiz.msg=S.wiz.msg??defaultMsg();S.wiz.step++;go()}else render();break;
   case "wcreate":if(wizValidate()){wizCreate();toast(L("Sagen er oprettet, og invitationen er sendt","The case was created and the invitation sent"));go()}else render();break;
   case "wdemo":{const w=S.wiz;const A=(f,l,cp,t,comp,cvr)=>Object.assign(blankApp(),{first:f,last:l,cpr:cp,email:f.toLowerCase()+"."+l.toLowerCase()+"@example.dk",phone:"+45 20 30 40 50",addr:"Algade 22",zip:"4000",city:"Roskilde",type:t,company:comp||"",cvr:cvr||""});
     if(d.k==="emp"){w.a[0]=A("Maria","Holt","150390-1234","emp");w.co=false}
     else if(d.k==="self"){w.a[0]=A("Kim","Lassen","020285-1234","self","Lassen VVS ApS","40112233");w.co=false}
     else{w.a[0]=A("Peter","Skov","110981-1234","self","Skov Rådgivning ApS","39887766");w.a[1]=A("Julie","Skov","230884-1234","emp");w.co=true}
     Object.assign(w,{purpose:"buy",price:"3200000",downpay:"320000",propType:1,propAddr:"Bakkevej 9",propZip:"4000",propCity:"Roskilde",takeover:"2027-01-01"});w.err=[];render();break}
   case "copylink":{const c=byId(CASES,d.id);const link="https://laan360.example/k/"+c.id.toLowerCase()+"-"+d.i;const done=()=>toast(L("Kundelink kopieret","Customer link copied"));try{navigator.clipboard.writeText(link).then(done,done)}catch(_){done()}break}
   case "remind":{const c=byId(CASES,d.id);hist(c,"Påmindelse sendt til kunden","Reminder sent to the customer");toast(L("Påmindelse sendt (simuleret)","Reminder sent (simulated)"));render();break}
   case "cusopen":S.cus={...S.cus,caseId:d.id,ai:+d.i,step:0,bankPick:null,confirm:false,err:"",bud:null,editing:false};S.view="cus";go();break;
   case "viewdoc":S.modal=docPreview(C(),d.k);render();break;
   case "closemodal":S.modal=null;render();break;
   case "reject":S.rejecting=d.k;render();setTimeout(()=>document.getElementById("rejReason")?.focus(),0);break;
   case "cancelrej":S.rejecting=null;render();break;
   case "dorej":{const c=C();const [ai,nr]=d.k.split("|");const n=isNaN(+nr)?nr:+nr;const reason=document.getElementById("rejReason").value.trim()||L("Dokumentet kan ikke bruges. Kontakt din rådgiver.","The document cannot be used. Contact your advisor.");
     if(ai==="c"){c.rejected[n]=reason;if(n===10){c.budget=null}else delete c.uploads[n]}else{const ap=c.apps[+ai];ap.rejected[n]=reason;if(n===11){delete ap.uploads["11a"];delete ap.uploads["11b"]}else delete ap.uploads[n];ap.submitted=false}
     hist(c,"Dokument afvist: "+(ai==="c"?(EXTRA[n]?EXTRA[n][0]:DOC[n][0]):DOC[n][0]),"Document rejected: "+(ai==="c"?(EXTRA[n]?EXTRA[n][1]:DOC[n][1]):DOC[n][1]));
     S.rejecting=null;toast(L("Dokumentet er afvist, og kunden har fået besked","The document was rejected and the customer notified"));render();break}
   case "request":{const c=C();const [ai,nr]=d.k.split("|");const n=isNaN(+nr)?nr:+nr;const nm=ai==="c"?(EXTRA[n]||DOC[n]):DOC[n];hist(c,"Anmodning sendt: "+nm[0],"Request sent: "+nm[1]);toast(L("Anmodning sendt til kunden (simuleret)","Request sent to the customer (simulated)"));render();break}
   case "savesum":C().summary=document.getElementById("summary").value;hist(C(),"Kundeopsummering opdateret","Customer summary updated");toast(L("Opsummering gemt","Summary saved"));render();break;
   case "tocredit":C().stage="credit";hist(C(),"Sendt til kreditvurdering","Sent to credit assessment");toast(L("Sagen er sendt til kreditvurdering","The case was sent to credit assessment"));render();break;
   case "close":C().stage="done";hist(C(),"Sag afsluttet","Case closed");toast(L("Sagen er afsluttet","The case is closed"));render();break;
   case "support":toast(L("Supportsag oprettet (simuleret)","Support ticket created (simulated)"));break;
   /* kunde */
   case "cusnext":{const {a:ap}=cusCtx();if(cusSteps()[S.cus.step][0]==="welcome"&&ap.submitted){S.cus.step=cusSteps().length-1;S.cus.editing=false}else S.cus.step++;go();break}
   case "cusprev":if(S.cus.step>0)S.cus.step--;S.cus.err="";go();break;
   case "cusgo":S.cus.step=+d.s;S.cus.editing=true;go();break;
   case "cusfix":{const {c,a:ap,main}=cusCtx();ap.submitted=false;S.cus.editing=true;S.cus.step=cusSteps().findIndex(s=>s[0]==="upload");go();break}
   case "cuslogout":S.cus.step=0;go();break;
   case "cusreset":{const {c,a:ap,ai,main}=cusCtx();const fresh=mkA({...ap,fin:ap.fin,mitid:false,mitidAt:null,consents:{skat:null,bank:null,pension:null,vehicle:null,tinglysning:null},bankLinked:false,banks:[],accounts:[],uploads:{},rejected:{},infoDone:false,submitted:false,carAns:null,debtNote:""});
     c.apps[ai]=fresh;if(main){c.budget=null;c.uploads={};c.rejected={}}S.cus.step=0;S.cus.bud=null;S.cus.confirm=false;toast(L("Kundens forløb er nulstillet","The customer's journey was reset"));go();break}
   case "cuspurp":{const {c}=cusCtx();if(c.purpose!==d.k){c.purpose=d.k;hist(c,"Kunden har ændret formål","The customer changed the purpose")}render();break}
   case "mitid":{const {c,a:ap}=cusCtx();S.cus.mitidBusy=true;render();setTimeout(()=>{ap.mitid=true;ap.mitidAt=0;S.cus.mitidBusy=false;hist(c,fullName(ap)+" loggede ind med MitID",fullName(ap)+" signed in with MitID");render()},900);break}
   case "consent":{const {a:ap}=cusCtx();const def={skat:true,bank:true,pension:true,vehicle:false,tinglysning:false};const cur=ap.consents[d.k]??def[d.k];S.cus.pending=S.cus.pending||{};ap.consents[d.k]=!cur;render();break}
   case "consentsave":{const {c,a:ap}=cusCtx();const def={skat:true,bank:true,pension:true,vehicle:false,tinglysning:false};Object.keys(def).forEach(k=>{if(ap.consents[k]==null)ap.consents[k]=def[k]});ap.fetchAt=0;
     if(!ap.consents.bank){ap.bankLinked=false}hist(c,fullName(ap)+" gav samtykke ("+Object.keys(def).filter(k=>ap.consents[k]).length+" kilder)",fullName(ap)+" gave consent ("+Object.keys(def).filter(k=>ap.consents[k]).length+" sources)");S.cus.step++;go();break}
   case "bankpick":{const {c,a:ap}=cusCtx();S.cus.connecting=d.b;render();setTimeout(()=>{if(!ap.banks.includes(d.b))ap.banks.push(d.b);if(!ap.accounts.length)ap.accounts=defaultAccounts();else ap.accounts.push({n:["Konto i "+d.b,"Account at "+d.b],no:"•••• "+(1000+Math.floor(Math.random()*8999)),bal:Math.round(5000+Math.random()*40000),on:true});
     S.cus.connecting=false;S.cus.bankPick=null;render()},900);break}
   case "bankadd":S.cus.bankPick="add";render();break;
   case "bankcancel":S.cus.bankPick=null;render();break;
   case "acct":{const {a:ap}=cusCtx();ap.accounts[+d.i].on=el.checked;render();break}
   case "banksave":{const {c,a:ap}=cusCtx();ap.bankLinked=true;ap.fetchAt=0;hist(c,fullName(ap)+" forbandt sin bank",fullName(ap)+" connected their bank");S.cus.step++;go();break}
   case "civil":{const {a:ap}=cusCtx();ap.civil=+d.v;render();break}
   case "kids":{const {a:ap}=cusCtx();ap.kids=+d.v;render();break}
   case "carans":{const {a:ap}=cusCtx();ap.carAns=d.v;render();break}
   case "infosave":{const {c,a:ap}=cusCtx();ap.phone=document.getElementById("ci-phone").value;ap.email=document.getElementById("ci-email").value;ap.debtNote=document.getElementById("ci-debt").value;
     const emp=document.getElementById("ci-emp");if(emp){if(ap.type==="emp")ap.employer=emp.value;else ap.company=emp.value}
     ap.infoDone=true;ap.infoAt=0;if(ap.civil==null)ap.civil=0;if(ap.kids==null)ap.kids=0;S.cus.step++;go();break}
   case "samplefile":{const {c,a:ap}=cusCtx();const files=(FILES[d.k]||["dokument.pdf"]).map(n=>({n,d:0}));if(d.sag){c.uploads[d.k]=files;delete c.rejected[d.k]}else{ap.uploads[d.k]=files;delete ap.rejected[["11a","11b"].includes(d.k)?11:d.k]}
     hist(c,fullName(ap)+" uploadede dokumenter",fullName(ap)+" uploaded documents");render();break}
   case "budsave":{const {c}=cusCtx();c.budget=JSON.parse(JSON.stringify(S.cus.bud));delete c.rejected[10];hist(c,"Budget udfyldt af kunden","Budget filled in by the customer");S.cus.step++;go();break}
   case "cusconfirm":S.cus.confirm=el.checked;S.cus.err="";break;
   case "cussubmit":{const {c,a:ap}=cusCtx();if(!S.cus.confirm){S.cus.err=L("Sæt kryds for at bekræfte oplysningerne.","Tick the box to confirm the information.");render();break}
     ap.submitted=true;ap.submittedAt=0;S.cus.editing=false;S.cus.confirm=false;hist(c,fullName(ap)+" sendte sin "+(c.apps.length>1?"del af sagen":"sag"),fullName(ap)+" submitted "+(c.apps.length>1?"their part of the case":"their case"));
     (c.messages=c.messages||[]).unshift({d:0,t:nowHM(),from:fullName(ap),da:"Har sendt mine oplysninger.",en:"I have sent my information.",unread:true});go();break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr[data-a]"))e.target.click();if(e.key==="Escape"&&S.modal){S.modal=null;render()}});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;if(S.page!=="cases"&&S.page!=="home")S.page="cases";render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos);return}
  if(t.dataset.w&&!t.dataset.rerender){let v=t.value;setPath(S.wiz,t.dataset.w,v);if(t.dataset.w==="msg")return;
    if(S.wiz.step===3&&["price","downpay"].includes(t.dataset.w)){const pos=t.selectionStart;render();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}return}
  if(t.dataset.bud){const k=t.dataset.bud;if(k.startsWith("inc."))S.cus.bud.inc[+k.slice(4)]=+t.value||0;else S.cus.bud[k]=+t.value||0;
    const b=S.cus.bud;const inc=b.inc.reduce((s,x)=>s+(+x||0),0),exp=BUD.reduce((s,[k])=>s+(+b[k]||0),0);const el=document.getElementById("budDisp");el.textContent=kr(inc-exp);el.style.color=inc-exp<0?"var(--bad)":"var(--ink)";}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.w&&(t.tagName==="SELECT")){let v=t.value;if(t.dataset.w==="a.1.sameAddr")v=!!v;setPath(S.wiz,t.dataset.w,v);render();return}
  if(t.id==="cusSel"){const [id,i]=t.value.split("|");S.cus={...S.cus,caseId:id,ai:+i,step:0,bud:null,confirm:false,err:"",editing:false,bankPick:null};go();return}
  if(t.dataset.up&&t.files.length){const {c,a:ap}=cusCtx();const files=[...t.files].map(f=>({n:f.name,d:0}));const k=t.dataset.up;
    if(t.dataset.sag){c.uploads[k]=files;delete c.rejected[k]}else{ap.uploads[isNaN(+k)?k:+k]=files;delete ap.rejected[["11a","11b"].includes(k)?11:+k]}hist(c,fullName(ap)+" uploadede dokumenter",fullName(ap)+" uploaded documents");render()}
});
render();
